[package]
name = "newfoundsync"
version = "0.0.6"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Lightweight LAN audio sharing with tight multiroom sync (desktop)"

[features]
# `gui` (default): the native egui server GUI (pulls eframe + qrcode; on Linux that needs the
# X11/Wayland/GL dev stack). Build a pure headless server with `--no-default-features` — no GUI
# and none of those display dependencies (ideal for a Linux server).
#
# `vp9` (NOT default): the CPU VP9 fallback encoder, which links libvpx — a C library you must
# supply via vcpkg plus four VPX_* environment variables. It is deliberately opt-in because it was
# previously unconditional, which meant `cargo build --release` (the command in the README) failed on
# a fresh Windows clone before you'd done any vcpkg setup. Video defaults to AV1 (GPU via Media
# Foundation, else the prebuilt static SVT-AV1) and needs none of that. Enable with
# `--features vp9` when you specifically want `--encoder vp9`; see the VP9 section of the README.
default = ["gui"]
gui = ["dep:eframe", "dep:qrcode"]
vp9 = ["dep:env-libvpx-sys"]
# `video-encode` (NOT default): compile the AV1 encoder on non-Windows hosts.
#
# On Windows the encoder is always built -- it is the only platform with local screen capture, so
# there is something to encode. Elsewhere there is nothing to feed it yet, so it is opt-in: it links
# SVT-AV1, and the headless Linux server package has no reason to carry a video codec it cannot use.
# This exists so the Linux/macOS capture work can be developed and CI-checked against a real encoder
# before any capture backend lands. Enabling it on Windows is a no-op (the encoder is already in).
video-encode = ["dep:shiguredo_svt_av1"]
# `video-encode-source`: same, but COMPILE SVT-AV1 from source instead of downloading a prebuilt.
#
# Needed more often than you would guess. shiguredo_svt_av1's build script derives the prebuilt
# archive name as `ubuntu-{VERSION_ID}` for every Linux target — it assumes Ubuntu — so on Fedora 44
# it asks for `libSvtAv1Enc-ubuntu-44_x86_64.tar.gz` and dies on a 404. Same story for any distro
# without a published build, and for Intel Macs (the macOS prebuilt is arm64-only).
# Costs a cmake + nasm build dependency, which is exactly why it is not the default.
video-encode-source = ["video-encode", "shiguredo_svt_av1/source-build"]
# `linux-capture` (NOT default): real screen capture on Linux via xdg-desktop-portal ScreenCast +
# PipeWire. Implies the encoder, since captured frames are useless without one — and the SOURCE
# variant of it, because the prebuilt SVT-AV1 download 404s on every distro we build on.
#
# Needs libpipewire-0.3-dev + clang (bindgen) to build, and at RUNTIME a desktop session with a
# portal backend (xdg-desktop-portal-kde / -gnome). A headless server can never satisfy that, which
# is why this is opt-in rather than on for the Linux packages.
linux-capture = ["video-encode-source", "dep:ashpd", "dep:pipewire"]

[[bin]]
name = "newfoundsync"
path = "src/main.rs"

[dependencies]
newfoundsync-core = { path = "../core" }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
# System-audio capture (loopback) still uses cpal; playback is now the browser's.
cpal = "0.18.1"
# The video encoders (SVT-AV1 + libvpx/VP9) are Windows-only deps — see the
# [target.'cfg(target_os = "windows")'.dependencies] section below. On Linux the server builds
# audio + web-cast relay only (no local screen capture), so those C libraries aren't pulled in.
# Data-parallel pixel conversions (BGRA→I420 for SVT-AV1/VP9, BGRA→NV12 for the MF GPU encoder) and frame scaling across cores.
rayon = "1"
# Web server: serves the embedded web client + a WebSocket that clock-syncs and
# streams audio/video to browsers. Sync capture/encode threads bridge in via a
# broadcast channel.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
# Native server GUI (optional; `gui` feature, on by default). --no-default-features drops eframe +
# qrcode entirely, so a headless build needs no X11/Wayland/GL.
eframe = { version = "0.34", optional = true }
# Render a scannable QR of the connect URL (default features off → no image/svg deps).
qrcode = { version = "0.14", default-features = false, optional = true }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
rcgen = "0.14.8"
rustls = { version = "0.23.40", features = ["ring"] }

# Windows-only screen capture (WGC). The video capture module is cfg'd to Windows;
# Linux capture (PipeWire) is a follow-up.
[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "2.0.0"
# Media Foundation (GPU AV1 encode) + WASAPI process-loopback capture.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    # VARIANT (the mf_encoder low-latency ICodecAPI hint) is gated on BOTH Com + Ole in windows-rs;
    # without Win32_System_Ole the build compiled only via eframe's feature unification — so a
    # headless (no-eframe) build broke. Listed explicitly to be self-sufficient.
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Audio",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
] }
# `#[implement]` (COM callback for ActivateAudioInterfaceAsync) emits windows_core paths.
windows-core = "0.62"
# Video encoders — Windows-only (the only platform with local screen capture today).
# Software AV1: prebuilt SvtAv1Enc static lib (Windows needs only curl/tar/certutil; wraps
# SVT-AV1 v4.1.0; crate is edition 2024 → rustc >= 1.88).
shiguredo_svt_av1 = "2026.1.0"
# Software VP9 via libvpx — OPTIONAL, behind the `vp9` feature (see [features] above). env-libvpx-sys
# ships PRE-GENERATED 1.13.0 bindings, so the repo pins libvpx to 1.13.1 (vcpkg.json — closest vcpkg
# carries, same 1.13.x ABI). Supply libvpx via vcpkg:
# `vcpkg install --triplet x64-windows-static` + env VPX_LIB_DIR / VPX_INCLUDE_DIR
# (→ vcpkg_installed/x64-windows-static) / VPX_VERSION=1.13.0 / VPX_STATIC=1. See README.
env-libvpx-sys = { version = "5.1.3", optional = true }

# Software AV1 for non-Windows hosts, behind the `video-encode` feature (see [features]). Kept in a
# separate target table from the Windows entry above so Windows gets it unconditionally while every
# other platform only pulls it — and its C build — when explicitly asked.
[target.'cfg(not(target_os = "windows"))'.dependencies]
shiguredo_svt_av1 = { version = "2026.1.0", optional = true }

# Linux-only: native PulseAudio/PipeWire capture of the system output's monitor (cpal/ALSA can't
# see PipeWire `.monitor` sources). libpulse ships in the Freedesktop runtime; the .deb build needs
# libpulse-dev (Fedora: pulseaudio-libs-devel).
[target.'cfg(target_os = "linux")'.dependencies]
# Screen capture behind `linux-capture` (see [features]).
#
# The versions are coupled and NOT free to choose: ashpd 0.13.13 depends on pipewire ^0.9, and both
# pipewire-sys 0.9 and 0.10 declare `links = "pipewire-0.3"`, so asking for 0.10 alongside ashpd is
# unresolvable ("only one package in the dependency graph may specify the same links value"). Pin to
# ashpd's own choice.
ashpd = { version = "0.13.13", default-features = false, features = ["screencast", "pipewire", "tokio"], optional = true }
pipewire = { version = "0.9", optional = true }
# libpulse-binding's lib is `libpulse_binding` and libpulse-simple-binding's is
# `libpulse_simple_binding`; the ecosystem convention aliases them to `pulse` / `psimple`. Rename
# via `package =` so the `use pulse::…` / `use psimple::…` in capture/pulse.rs resolve.
pulse = { package = "libpulse-binding", version = "2" }
psimple = { package = "libpulse-simple-binding", version = "2" }

# Embed branding/icon.ico into newfoundsync.exe (Explorer / Start menu icon).
[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

# --- Debian packaging (headless Linux server) --------------------------------------------------
# Build the .deb ON a Linux box: `cargo install cargo-deb`, then from the repo root
# `cargo deb -p newfoundsync --no-default-features` (headless — no GUI, no SVT-AV1/libvpx).
# See packaging/README-debian.md for the apt build-deps.
[package.metadata.deb]
maintainer = "Alex Hurshman <alex.hurshman@qracorp.com>"
copyright = "2026 Alex Hurshman and the Newfoundsync contributors"
section = "sound"
priority = "optional"
extended-description = """
Newfoundsync headless server: serves the embedded web client over HTTPS + WebSocket so LAN \
browsers clock-sync and play audio in lock-step. Audio source is a PulseAudio/PipeWire monitor \
(--capture system) or a web-cast uplink (--capture web). Screen video and per-window capture are \
Windows-only; this Linux build is audio + web-cast relay."""
depends = "$auto"
conflicts = "newfoundsync-gui"
assets = [
    ["target/release/newfoundsync", "usr/bin/", "755"],
    ["packaging/newfoundsync.service", "lib/systemd/system/", "644"],
]

# The DESKTOP package — the egui server window, a menu entry and icons, and no systemd unit
# (a login-session GUI has no business being a system service). Build it with:
#   cargo deb -p newfoundsync --variant gui
# Note the feature difference, which cargo-deb does NOT infer from the variant: the headless
# package above must be built with `--no-default-features`, this one with defaults (= `gui`).
# Both ship /usr/bin/newfoundsync, hence the mutual `conflicts` — installing one replaces the
# other rather than silently fighting over the same path.
[package.metadata.deb.variants.gui]
name = "newfoundsync-gui"
conflicts = "newfoundsync"
replaces = "newfoundsync"
extended-description = """
Newfoundsync desktop server: a small window that picks an audio source, shows a QR code for \
listeners to scan, and serves the embedded web client over HTTPS + WebSocket so LAN browsers \
clock-sync and play in lock-step. Audio comes from a PulseAudio/PipeWire monitor — the whole \
system output, or a single application. Screen video and per-window capture are Windows-only."""
assets = [
    ["target/release/newfoundsync", "usr/bin/", "755"],
    ["../../flatpak/ca.newfoundsync.Newfoundsync.desktop", "usr/share/applications/", "644"],
    ["../../branding/icon-128.png", "usr/share/icons/hicolor/128x128/apps/ca.newfoundsync.Newfoundsync.png", "644"],
    ["../../branding/icon-256.png", "usr/share/icons/hicolor/256x256/apps/ca.newfoundsync.Newfoundsync.png", "644"],
    ["../../branding/icon-512.png", "usr/share/icons/hicolor/512x512/apps/ca.newfoundsync.Newfoundsync.png", "644"],
]

# --- RPM packaging (Fedora / RHEL) --------------------------------------------------------------
# Mirrors the Debian setup above: the base package is the HEADLESS server, the `gui` variant is the
# desktop app. Build them ON a Fedora box (`cargo install cargo-generate-rpm`) from the repo root:
#   cargo build --release -p newfoundsync --no-default-features && cargo generate-rpm -p crates/desktop
#   cargo build --release -p newfoundsync && cargo generate-rpm -p crates/desktop --variant gui
# (cargo-generate-rpm's -p is a PATH to the package dir -- it opens "<-p>/Cargo.toml" -- even though
# its --help calls it a crate name. Passing the crate name fails with "newfoundsync/Cargo.toml".)
# Asset `source` paths are relative to the invocation directory (the workspace root), which is why
# they are spelled differently from cargo-deb's package-relative ones.
#
# auto-req is left on: rpmbuild's find-requires reads the ELF and pins the real sonames
# (libpulse, libopus, glibc). Note it shares the .deb's blind spot — eframe/wgpu dlopen the
# Wayland/X11/Vulkan libraries, so they cannot be discovered from the binary and are listed by
# hand under the gui variant's `requires`.
[package.metadata.generate-rpm]
summary = "Lightweight LAN audio sharing with tight multiroom sync (headless server)"
assets = [
    { source = "target/release/newfoundsync", dest = "/usr/bin/newfoundsync", mode = "755" },
    { source = "crates/desktop/packaging/newfoundsync.service", dest = "/usr/lib/systemd/system/newfoundsync.service", mode = "644" },
]

[package.metadata.generate-rpm.conflicts]
newfoundsync-gui = "*"

# The DESKTOP package. No systemd unit — a login-session GUI has no business being a system
# service. Both packages own /usr/bin/newfoundsync, hence Conflicts + Obsoletes so installing one
# displaces the other instead of fighting over the path.
[package.metadata.generate-rpm.variants.gui]
name = "newfoundsync-gui"
summary = "Lightweight LAN audio sharing with tight multiroom sync (desktop app)"
assets = [
    { source = "target/release/newfoundsync", dest = "/usr/bin/newfoundsync", mode = "755" },
    { source = "flatpak/ca.newfoundsync.Newfoundsync.desktop", dest = "/usr/share/applications/ca.newfoundsync.Newfoundsync.desktop", mode = "644" },
    { source = "branding/icon-128.png", dest = "/usr/share/icons/hicolor/128x128/apps/ca.newfoundsync.Newfoundsync.png", mode = "644" },
    { source = "branding/icon-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/ca.newfoundsync.Newfoundsync.png", mode = "644" },
    { source = "branding/icon-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/ca.newfoundsync.Newfoundsync.png", mode = "644" },
]

# Hand-listed because find-requires cannot see a dlopen. Without these the package installs on a
# fresh box and then fails to open a window — the exact defect the .deb still has.
[package.metadata.generate-rpm.variants.gui.requires]
libxkbcommon = "*"
libwayland-client = "*"
libX11 = "*"
libXcursor = "*"
libXrandr = "*"
libXi = "*"
mesa-libGL = "*"
vulkan-loader = "*"

[package.metadata.generate-rpm.variants.gui.conflicts]
newfoundsync = "*"

[package.metadata.generate-rpm.variants.gui.obsoletes]
newfoundsync = "*"
