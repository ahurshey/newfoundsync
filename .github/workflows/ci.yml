name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Newer pushes to the same ref supersede in-flight runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Coverage note — read before trusting a green run.
#
# The `test` job below builds Linux + `--no-default-features`. That combination excludes gui.rs (the
# largest file in the repo, behind the `gui` feature) AND every Windows-gated module: WASAPI capture,
# the Media Foundation encoder, WGC screen capture. That was HALF the Rust in the repo never being
# compiled by CI, so a type or borrow error in gui.rs could ship green. The `gui-check` and `windows`
# jobs exist purely to close that gap — keep them.
jobs:
  # Type-check the GUI. Compiling gui.rs at all is the point; no tests here need a display.
  gui-check:
    name: cargo check with the GUI feature (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The `gui` feature pulls eframe, which needs the X11/Wayland/GL dev stack even just to compile.
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libopus-dev libasound2-dev libpulse-dev \
            libxkbcommon-dev libwayland-dev libxcb1-dev libx11-dev libxrandr-dev \
            libxi-dev libxcursor-dev libgl1-mesa-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: gui-check

      # Default features = `gui`. --all-targets so the GUI's tests/examples type-check too.
      - name: cargo check (default features, incl. gui.rs)
        run: cargo check --workspace --all-targets

  # The AV1 encoder on a NON-Windows host, behind `video-encode`. It is not part of any shipped
  # Linux artifact yet -- this job exists so the Linux/macOS screen-capture work cannot silently rot
  # the moment someone touches codec.rs, since nothing else off Windows compiles that module.
  #
  # Uses `video-encode-source`, NOT `video-encode`: shiguredo_svt_av1's prebuilt download derives its
  # archive name as `ubuntu-{VERSION_ID}`, and upstream publishes only 22.04/24.04 -- so on a newer
  # ubuntu-latest runner the prebuilt path 404s. Building from source needs cmake + nasm + git + a
  # C++ compiler + libclang (for bindgen); every one of those was discovered by hitting its failure.
  encoder-check:
    name: cargo check the AV1 encoder off Windows (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             build-essential pkg-config libopus-dev libasound2-dev libpulse-dev             cmake nasm git g++ libclang-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: encoder-check

      - name: cargo check (headless + video-encode-source)
        run: cargo check -p newfoundsync --no-default-features --features video-encode-source

  # Compile + test the Windows-only half: WASAPI capture, the MF encoder, WGC capture.
  #
  # VP9/libvpx is behind the non-default `vp9` feature precisely so this job needs no vcpkg. Known and
  # accepted gap: that means video/vp9.rs (and its one test) is still not compiled by ANY CI job —
  # covering it would mean building libvpx from vcpkg here, which is a lot of CI time for an opt-in
  # fallback codec. If VP9 ever stops being optional, add `--features vp9` plus a vcpkg cache step.
  windows:
    name: cargo test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows

      # Default features: the GUI plus every cfg(windows) capture/encode module. This is the first
      # config in which capture/{system,process,sessions}.rs and video/{capture,codec,mf_encoder}.rs
      # are compiled by CI at all.
      - name: cargo test (default features)
        run: cargo test --workspace --all-targets

      # The headless Windows build broke once before (a windows-rs feature was only satisfied via
      # eframe's feature unification), so check it explicitly rather than assuming.
      - name: cargo check (headless)
        run: cargo check -p newfoundsync --no-default-features

  test:
    name: cargo test + browser E2E (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Deps for the headless (no-GUI) Linux build:
      #   libopus-dev    -> audiopus (else it builds Opus from vendored source and needs autotools)
      #   libasound2-dev -> cpal (ALSA)
      #   libpulse-dev   -> the pulse/psimple system-audio capture (Linux-only deps)
      # The Windows-only video deps (SVT-AV1 / libvpx / windows-capture) are cfg'd out on Linux,
      # so there is no vcpkg / VPX setup to do here.
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libopus-dev libasound2-dev libpulse-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Headless build (drop the default `gui` feature): no X11/Wayland/GL stack needed, and no test
      # depends on the GUI. Covers the sync core + protocol + codec + cross-platform desktop helpers.
      - name: cargo test (workspace, headless)
        run: cargo test --workspace --no-default-features

      # Build the real server binary the browser harness boots.
      - name: Build server
        run: cargo build --release -p newfoundsync --no-default-features

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install E2E deps + Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # The sync/calibration DSP, unit tested without a browser. Runs in milliseconds and is the only
      # thing that catches a silent signal bug — the kind that yields a client which connects, plays,
      # and lands at the WRONG INSTANT while every other test stays green. Cheap, so run it first.
      - name: DSP unit tests (node --test)
        working-directory: e2e
        run: npm run test:unit

      # playwright.config.js auto-boots ../target/release/newfoundsync
      # (--headless --insecure-http --capture web) and tears it down after.
      - name: Browser E2E (chromium)
        working-directory: e2e
        run: npx playwright test --project=chromium

      - name: Upload Playwright report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  # THE CONFIGURATIONS WE ACTUALLY SHIP.
  #
  # Everything above builds default features or --no-default-features. Neither of those is what any
  # release artifact is built with, and two bugs escaped through exactly that gap in one afternoon:
  #
  #   * `vp9` did not imply `video-encode`, so `--features vp9` failed to compile anywhere the
  #     encoder module was not already on — caught only by hand-building for macOS.
  #   * widening the screen-capture cfg gates missed the one in main.rs, so --video stayed refused
  #     on a build that had a working backend.
  #
  # The note on the windows job called the VP9 gap "known and accepted ... if VP9 ever stops being
  # optional, add --features vp9". It has: VP9 now ships in all three artifacts.
  shipped-linux:
    name: cargo check the SHIPPED Linux config (Flatpak features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same list as encoder-check, plus what linux-capture and vp9 add: pipewire headers for the
      # portal capture, and libvpx for the VP9 encoder. clang/libclang covers bindgen for both
      # pipewire-sys and vp9-bindgen.
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libopus-dev libasound2-dev libpulse-dev \
            cmake nasm git g++ libclang-dev libpipewire-0.3-dev libvpx-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: shipped-linux

      # vp9-bindgen rather than vp9: distro libvpx is newer than the crate's pre-generated 1.13.0
      # bindings (the Flatpak runtime ships 1.14.1), and pairing those is a struct-layout mismatch.
      - name: cargo check (linux-capture + vp9-bindgen — what the Flatpak builds)
        run: cargo check -p newfoundsync --features linux-capture,vp9-bindgen

  shipped-macos:
    name: cargo check the SHIPPED macOS config
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Homebrew supplies opus + libvpx with .pc files, so pkg-config finds both and none of the
      # OPUS_*/VPX_* escape hatches are needed here (the dev Mac needs them only because it has no
      # Homebrew).
      - name: Install system deps
        run: brew install opus libvpx pkg-config

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: shipped-macos

      # Compiles capture_mac.rs (ScreenCaptureKit) and the vp9 encoder. Cannot RUN capture in CI —
      # Screen Recording is a TCC permission with no headless grant — so this is a compile gate only,
      # which is precisely the class of bug that got through.
      #
      # vp9-bindgen, not vp9: Homebrew's libvpx is newer than the crate's pre-generated bindings
      # (which stop at 1.13.0), so the plain feature panics in the build script here. The shipped
      # .pkg avoids that by building libvpx 1.13.1 into ~/.local and pinning VPX_VERSION; reproducing
      # that in CI would cost a source build for no extra coverage, because which BINDINGS are used
      # does not change any of our code — the point of this job is that capture_mac.rs and the vp9
      # module compile at all.
      - name: cargo check (mac-capture + vp9-bindgen)
        run: cargo check -p newfoundsync --features mac-capture,vp9-bindgen
