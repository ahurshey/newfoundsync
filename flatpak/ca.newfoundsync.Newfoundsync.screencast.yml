# Flatpak manifest VARIANT — the desktop server WITH Linux screen capture (`linux-capture`).
#
# Builds a working screen-capture Flatpak. Two things make it work that the plain manifest does not
# need:
#
#   * the llvm18 SDK extension, because bindgen needs libclang and the 24.08 SDK ships none (both
#     pipewire-sys and shiguredo_svt_av1 generate bindings);
#   * CMAKE_TOOLCHAIN_FILE pointing at cmake-force-libdir.cmake, which forces CMAKE_INSTALL_LIBDIR
#     to lib. Without it SVT-AV1 installs to <out>/lib64 while shiguredo_svt_av1's build script looks
#     in <out>/lib, and the link dies with "could not find native static library SvtAv1Enc". That
#     mismatch also blocks Fedora; see packaging/README-rpm.md.
#
# Kept separate from ca.newfoundsync.Newfoundsync.yml because it roughly doubles the build time and
# the image for a feature that only works on a machine with a desktop session and a portal backend.
#
# Build exactly like the other one, pointing at this file:
#   flatpak run org.flatpak.Builder --user --force-clean --disable-rofiles-fuse #     --repo=<repo> <builddir> flatpak/ca.newfoundsync.Newfoundsync.screencast.yml
#
# No extra finish-args are needed for capture: talking to org.freedesktop.portal.Desktop is what
# portals exist for, and a sandboxed app may call ScreenCast without additional permissions. The
# portal prompt is the permission.
# Build from the repo root:
#   flatpak-builder --user --force-clean --install-deps-from=flathub \
#     --repo=/tmp/nfs-flatpak-repo build-dir flatpak/ca.newfoundsync.Newfoundsync.yml
#   flatpak build-bundle /tmp/nfs-flatpak-repo ca.newfoundsync.Newfoundsync.flatpak ca.newfoundsync.Newfoundsync
app-id: ca.newfoundsync.Newfoundsync
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
# bindgen needs libclang, and the 24.08 SDK ships none -- both pipewire-sys and shiguredo_svt_av1
# generate bindings, so without this the build dies in the build script rather than the compiler.
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm18
command: newfoundsync
finish-args:
  - --socket=wayland          # egui window (Wayland)
  - --socket=fallback-x11     # …or X11
  - --share=ipc               # X11 shared memory
  - --device=dri              # GPU for the egui/glow window
  - --socket=pulseaudio       # capture system/loopback audio via PipeWire/Pulse
  - --share=network           # serve HTTPS + WebSocket to LAN browsers
build-options:
  # Local build: network is shared so cargo can fetch crates AND we can bootstrap rustc.
  build-args:
    - --share=network
  append-path: /usr/lib/sdk/llvm18/bin
  prepend-ld-library-path: /usr/lib/sdk/llvm18/lib
  env:
    CARGO_HOME: /run/build/newfoundsync/cargo-home
    RUSTUP_HOME: /run/build/newfoundsync/rustup
    # bindgen finds libclang through this, not through PATH.
    LIBCLANG_PATH: /usr/lib/sdk/llvm18/lib
    # See cmake-force-libdir.cmake. Absolute path because CMake resolves a relative toolchain file
    # against its own build directory, not ours.
    CMAKE_TOOLCHAIN_FILE: /run/build/newfoundsync/flatpak/cmake-force-libdir.cmake
modules:
  # FFmpeg in the 24.08 runtime has VA-API but no active NVENC backend. Build the NVIDIA codec
  # headers and an FFmpeg binary in /app so NVIDIA Ada+ can use `av1_nvenc`; it dlopens the host
  # driver extension's libnvidia-encode at runtime, rather than bundling any proprietary driver.
  # VA-API remains enabled in this binary for Intel and AMD AV1 hardware.
  - name: nv-codec-headers
    buildsystem: simple
    build-commands:
      - make PREFIX=/app LIBDIR=lib install
    sources:
      - type: git
        url: https://github.com/FFmpeg/nv-codec-headers.git
        tag: n12.2.72.0
        commit: 157becbf51c8b813425572b75c06c370bd43d8fd
  - name: ffmpeg-hw-encode
    buildsystem: simple
    build-commands:
      - PKG_CONFIG_PATH=/app/lib/pkgconfig:$PKG_CONFIG_PATH ./configure --prefix=/app --disable-doc --disable-debug --disable-static --enable-shared --disable-autodetect --enable-ffnvcodec --enable-nvenc --enable-vaapi --enable-libdrm
      - make -j${FLATPAK_BUILDER_N_JOBS}
      - make install
    sources:
      - type: git
        url: https://github.com/FFmpeg/FFmpeg.git
        tag: n7.1.2
        commit: 7003a8c4544b780eb0ab5c02ac4ad89d2132f2a2
  # egui bundles Ubuntu Light but no regular proportional face. Ship Ubuntu Regular (Ubuntu Font
  # Licence 1.0) so this Flatpak can use a more legible middle weight without host-font variance.
  - name: ubuntu-regular-font
    buildsystem: simple
    build-commands:
      - install -Dm644 Ubuntu-Regular.ttf /app/share/newfoundsync/Ubuntu-Regular.ttf
    sources:
      - type: file
        url: https://github.com/google/fonts/raw/main/ufl/ubuntu/Ubuntu-Regular.ttf
        sha256: 3128df86a31805618436d0ae5651ba4285d0c9de0a39057d025f64ee33bceb64
        dest-filename: Ubuntu-Regular.ttf
  - name: newfoundsync
    buildsystem: simple
    build-commands:
      # The 24.08 rust-stable SDK extension is rustc 1.89, but eframe 0.34.3 needs rustc 1.92, so
      # bootstrap a current stable toolchain with rustup instead. (curl ships in the Freedesktop SDK.)
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o rustup-init.sh
      - sh rustup-init.sh -y --profile minimal --default-toolchain stable --no-modify-path
      # GUI + Linux capture + hardware AV1. `linux-hw-encode` implies linux-capture and its
      # source-built SVT-AV1 fallback. The FFmpeg module above provides VA-API (AMD/Intel) and
      # NVENC (NVIDIA Ada+) at runtime; Auto uses either supported host encoder, otherwise CPU.
      #
      # The source build is needed because shiguredo_svt_av1 derives its prebuilt name as
      # `ubuntu-{VERSION_ID}`, and inside this SDK that resolves to `ubuntu-24.08`, which does not
      # exist -> 404.
      # vp9-bindgen, not vp9: the runtime ships libvpx 1.14.1 and the crate's pre-generated
      # bindings stop at 1.13.0 — generating them against the real headers is the only safe
      # pairing. libclang is already here for pipewire-sys/SVT-AV1, so it costs nothing extra.
      - $CARGO_HOME/bin/cargo build --release -p newfoundsync --features linux-hw-encode,vp9-bindgen
      - install -Dm755 target/release/newfoundsync /app/bin/newfoundsync
      - install -Dm644 flatpak/ca.newfoundsync.Newfoundsync.desktop /app/share/applications/ca.newfoundsync.Newfoundsync.desktop
      - install -Dm644 flatpak/ca.newfoundsync.Newfoundsync.metainfo.xml /app/share/metainfo/ca.newfoundsync.Newfoundsync.metainfo.xml
      - install -Dm644 branding/icon-128.png /app/share/icons/hicolor/128x128/apps/ca.newfoundsync.Newfoundsync.png
      - install -Dm644 branding/icon-256.png /app/share/icons/hicolor/256x256/apps/ca.newfoundsync.Newfoundsync.png
      - install -Dm644 branding/icon-512.png /app/share/icons/hicolor/512x512/apps/ca.newfoundsync.Newfoundsync.png
    sources:
      - type: dir
        path: ..
        # Without these skips the source copy drags in the whole working tree — `target/` alone is
        # multi-gigabyte, and a Windows-built `target/` is useless here anyway. Copying it doesn't just
        # waste time and disk: flatpak-builder hashes the source dir, so any local rebuild would
        # invalidate the cache every time.
        skip:
          - target
          - .git
          - vcpkg_installed
          - e2e/node_modules
          - e2e/playwright-report
          - e2e/test-results
          - dist
